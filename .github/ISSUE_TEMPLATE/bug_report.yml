name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove private data from logs."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Gitwood version/revision, OS/architecture, Git version if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal safe fixture and relevant repository state
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (with sensitive content removed)
