[package]
name = "gitwood-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri-independent domain logic for Gitwood"

[dependencies]
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "rt", "macros", "sync", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify = "8"
similar = { version = "3.2.1", features = ["unicode", "inline"] }
